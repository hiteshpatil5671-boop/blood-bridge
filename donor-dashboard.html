        .dashboard-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
}
        button {
    background: #d62828;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
            button:hover {
    background: #b71c1c;
    transform: translateY(-2px);
}
}
    body {

    margin: 0 auto;
}

</head>

    <p>Welcome to your BloodBridge donor dashboard.</p>

</div>

    <div class="dashboard-card">
    <h2>My Donor Profile</h2>
        <button id="edit-profile-btn">Edit Profile</button>
       
        <p>Your registered donor information</p>
        <hr>

    <div id="donor-info">

        </div>
        <form id="edit-profile-form" style="display:none;">
<input type="text" id="edit-name" placeholder="Name">
<input type="text" id="edit-blood-group" placeholder="Blood Group">
<input type="text" id="edit-location" placeholder="Location">
<button type="submit">Save Changes</button>
</form>
        
    </div>
    <script>
    const donor = JSON.parse(localStorage.getItem("bloodbridge_donor"));

    if (donor) {
        document.getElementById("donor-info").innerHTML = `
            <p><strong>Name:</strong> ${donor.name}</p>
            <p><strong>Email:</strong> ${donor.email}</p>
            <p><strong>Blood Group:</strong> ${donor.bloodGroup}</p>
            <p><strong>Location:</strong> ${donor.location}</p>
        `;
    } else {
        document.getElementById("donor-info").innerHTML =
            "<p>No donor information found. Please login first.</p>";
    }
</script>
    <button onclick="logoutDonor()">Logout</button>

<script>
function logoutDonor() {
    localStorage.removeItem("bloodbridge_donor");
    window.location.href = "index.html";
}
</script>
