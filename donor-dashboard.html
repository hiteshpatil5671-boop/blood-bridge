<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBridge - Donor Dashboard</title>
    <style>
    body {
        background: #f5f5f5;
color: #333;
min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 30px;
    }

    .dashboard-card {
        background: white;
        padding: 20px;
        margin: 20px 0;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
</style>
</head>

<body>

    <h1>Donor Dashboard</h1>
    <p>Your BloodBridge donor profile</p>

    <p>Welcome to your BloodBridge donor dashboard.</p>
   
        <div>
    
    

    <div class="dashboard-card">
        <h3>🩸 Donor Status</h3>
        <p>Registered Donor</p>
    </div>
</div>
</div>
    <div class="dashboard-card">
    <h2>My Donor Profile</h2>
        <p>Your registered donor information</p>
        <hr>

    <div id="donor-info">
        </div>
        
    </div>
    <script>
    const donor = JSON.parse(localStorage.getItem("bloodbridge_donor"));

    if (donor) {
        document.getElementById("donor-info").innerHTML = `
            <p><strong>Name:</strong> ${donor.name}</p>
            <p><strong>Email:</strong> ${donor.email}</p>
            <p><strong>Blood Group:</strong> ${donor.bloodGroup}</p>
            <p><strong>Location:</strong> ${donor.location}</p>
        `;
    } else {
        document.getElementById("donor-info").innerHTML =
            "<p>No donor information found. Please login first.</p>";
    }
</script>
    <button onclick="logoutDonor()">Logout</button>

<script>
function logoutDonor() {
    localStorage.removeItem("bloodbridge_donor");
    window.location.href = "index.html";
}
</script>
</body>
</html>
